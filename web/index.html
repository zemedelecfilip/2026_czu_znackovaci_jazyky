<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktivní Kvíz - IT Otázky</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px; 
            line-height: 1.6;
        }
        h1 { 
            text-align: center; 
            color: #2c3e50; 
            border-bottom: 2px solid #3498db; 
            padding-bottom: 10px;
        }
        #quiz-container {
            margin-top: 30px;
        }
        .question { 
            background: #fff; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
        }
        .question h3 { 
            margin-top: 0; 
            color: #2980b9; 
            font-size: 1.15em; 
        }
        .option-label { 
            display: block; 
            padding: 10px 15px; 
            margin: 8px 0; 
            background: #fdfdfd; 
            border: 1px solid #e0e0e0; 
            border-radius: 5px; 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-label:hover {
            background-color: #f0f8ff;
            border-color: #b3d4fc;
        }
        .option-label input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }
        .text-answer {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-check {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-check:hover {
            background-color: #2980b9;
        }
        .feedback {
            margin-top: 15px;
            font-size: 1em;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        /* Barvy pro vyhodnocení */
        .correct-item { 
            background-color: #d4edda !important; 
            border-color: #c3e6cb !important; 
            color: #155724;
            font-weight: bold;
        }
        .wrong-item { 
            background-color: #f8d7da !important; 
            border-color: #f5c6cb !important; 
            color: #721c24;
            text-decoration: line-through;
        }
        .missed-item { 
            background-color: #fff3cd !important; 
            border-color: #ffeeba !important; 
            color: #856404;
            font-weight: bold;
            border-left: 5px solid #ffc107 !important;
        }
    </style>
</head>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const rawData = document.getElementById("quiz-data").value;
            const lines = rawData.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const container = document.getElementById("quiz-container");
            
            let questions = [];
            let currentQ = null;

            // Parser pro převod textu na objekty
            lines.forEach(line => {
                if (line.toLowerCase().startsWith('úloha')) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = { title: line, text: '', options: [], type: 'choice' };
                } else if (line.toLowerCase().startsWith('odpověď:')) {
                    if (currentQ) {
                        currentQ.type = 'text';
                        let ans = line.substring(8).trim();
                        if (ans.includes('(')) ans = ans.substring(0, ans.indexOf('(')).trim();
                        currentQ.answer = ans.toLowerCase();
                    }
                } else if (line.startsWith('[ ]') || line.startsWith('[x]')) {
                    if (currentQ) {
                        const isCorrect = line.startsWith('[x]');
                        const text = line.substring(3).trim();
                        currentQ.options.push({ text: text, correct: isCorrect });
                    }
                } else {
                    if (currentQ && currentQ.options.length === 0 && currentQ.type !== 'text') {
                        currentQ.text += (currentQ.text ? '<br>' : '') + line;
                    }
                }
            });
            if (currentQ) questions.push(currentQ);

            // Vykreslení HTML
            questions.forEach((q, qIndex) => {
                const qDiv = document.createElement("div");
                qDiv.className = "question";
                let html = `<h3>${q.title}</h3>`;
                if (q.text) html += `<p><strong>${q.text}</strong></p>`;

                if (q.type === 'choice') {
                    q.options.forEach((opt, oIndex) => {
                        html += `
                        <label class="option-label">
                            <input type="checkbox" name="q${qIndex}" data-correct="${opt.correct}">
                            ${opt.text}
                        </label>`;
                    });
                } else if (q.type === 'text') {
                    html += `<input type="text" class="text-answer" placeholder="Vaše odpověď..." data-answer="${q.answer}">`;
                }

                html += `
                    <button class="btn-check" onclick="evaluateAnswer(this)">Vyhodnotit</button>
                    <div class="feedback"></div>
                `;
                qDiv.innerHTML = html;
                container.appendChild(qDiv);
            });
        });

        // Logika vyhodnocování
        function evaluateAnswer(btn) {
            const qDiv = btn.closest('.question');
            const checkboxes = qDiv.querySelectorAll('input[type="checkbox"]');
            const textInput = qDiv.querySelector('.text-answer');
            const feedback = qDiv.querySelector('.feedback');
            
            let isCorrect = true;
            let hasCheckedAnything = false;

            if (checkboxes.length > 0) {
                checkboxes.forEach(cb => {
                    const shouldBeChecked = cb.dataset.correct === "true";
                    const label = cb.closest('.option-label');
                    
                    // Reset tříd
                    label.classList.remove('correct-item', 'wrong-item', 'missed-item');

                    if (cb.checked) hasCheckedAnything = true;

                    if (shouldBeChecked && cb.checked) {
                        label.classList.add('correct-item');
                    } else if (!shouldBeChecked && cb.checked) {
                        label.classList.add('wrong-item');
                        isCorrect = false;
                    } else if (shouldBeChecked && !cb.checked) {
                        label.classList.add('missed-item');
                        isCorrect = false;
                    }
                });

                if (!hasCheckedAnything) {
                    feedback.style.display = 'block';
                    feedback.style.backgroundColor = '#e2e3e5';
                    feedback.style.color = '#383d41';
                    feedback.innerHTML = 'Nevybrali jste žádnou odpověď.';
                    return;
                }

            } else if (textInput) {
                const userAnswer = textInput.value.trim().toLowerCase();
                const correctAnswer = textInput.dataset.answer;
                
                if (userAnswer === correctAnswer) {
                    textInput.style.backgroundColor = '#d4edda';
                    textInput.style.borderColor = '#28a745';
                } else {
                    textInput.style.backgroundColor = '#f8d7da';
                    textInput.style.borderColor = '#dc3545';
                    isCorrect = false;
                    feedback.style.display = 'block';
                    feedback.style.backgroundColor = '#f8d7da';
                    feedback.style.color = '#721c24';
                    feedback.innerHTML = `❌ Špatně. Správná odpověď zní: <b>${textInput.dataset.answer}</b>`;
                    return;
                }
            }

            feedback.style.display = 'block';
            if (isCorrect) {
                feedback.style.backgroundColor = '#d4edda';
                feedback.style.color = '#155724';
                feedback.innerHTML = '✅ Správně! Vše zodpovězeno perfektně.';
            } else {
                feedback.style.backgroundColor = '#f8d7da';
                feedback.style.color = '#721c24';
                feedback.innerHTML = '❌ Ve vaší odpovědi jsou chyby. <br><small>(Zeleně = správně zaškrtnuto, Žlutě = zapomněli jste zaškrtnout, Přeškrtnutá červená = špatně zaškrtnuto)</small>';
            }
        }
    </script>
